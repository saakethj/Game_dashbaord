<!DOCTYPE html>
<html lang="en" data-mode="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12131A;
    --surface: #1B1D26;
    --border: #2A2C38;
    --border-strong: #3A3D4D;
    --text: #EDEBE3;
    --text-soft: #9C9BA8;
    --high: #4FCB9A;
    --high-text: #0F2E23;
    --mid: #E8A23B;
    --mid-text: #3A2508;
    --low: #E2634F;
    --low-text: #3A1109;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-mode="dark"]) {
      --bg: #F5F4EF;
      --surface: #FFFFFF;
      --border: #DEDCD2;
      --border-strong: #C6C4B8;
      --text: #1D1C18;
      --text-soft: #6B6A61;
    }
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.6;
    padding: 32px 20px 60px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .sub { color: var(--text-soft); font-size: 14px; margin: 0 0 22px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  input[type="search"], select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 6px;
    outline: none;
  }
  input[type="search"] { flex: 1 1 220px; }
  input[type="search"]:focus, select:focus { border-color: var(--border-strong); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-soft);
    cursor: pointer;
  }
  .chip.active { border-color: var(--text); color: var(--text); background: var(--surface); }
  .count { color: var(--text-soft); font-size: 13px; margin-bottom: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 3px solid var(--border-strong);
    border-radius: 4px;
    padding: 16px 16px 14px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .title { font-family: 'Oswald', sans-serif; font-weight: 500; font-size: 18px; line-height: 1.25; margin: 0; }
  .score {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 22px;
    padding: 2px 9px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .score.high { background: var(--high); color: var(--high-text); }
  .score.mid  { background: var(--mid);  color: var(--mid-text); }
  .score.low  { background: var(--low);  color: var(--low-text); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag {
    font-size: 12px;
    color: var(--text-soft);
    border-left: 2px solid var(--border-strong);
    padding: 2px 8px 2px 7px;
    border-radius: 0;
  }
  .plot { font-size: 13.5px; color: var(--text-soft); margin: 0; }
  .flag { font-size: 11px; color: var(--mid); margin-top: 8px; }
  .empty { text-align: center; color: var(--text-soft); padding: 60px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Library</h1>
    <p class="sub" id="subtitle"></p>
    <div class="controls">
      <input type="search" id="search" placeholder="Search your library">
      <select id="sort">
        <option value="title">Sort: title</option>
        <option value="rating-desc">Sort: rating (high to low)</option>
        <option value="rating-asc">Sort: rating (low to high)</option>
        <option value="year-desc">Sort: newest first</option>
      </select>
    </div>
    <div class="chips" id="genreChips"></div>
  </header>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none">No games match that filter.</p>
</div>

let activeGenre = null;

function scoreTier(score) {
  if (score >= 85) return 'high';
  if (score >= 70) return 'mid';
  return 'low';
}

function allGenres() {
  const set = new Set();
  games.forEach(g => g.genres.forEach(x => set.add(x)));
  return [...set].sort();
}

function renderChips() {
  const container = document.getElementById('genreChips');
  container.innerHTML = '';
  allGenres().forEach(genre => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeGenre === genre ? ' active' : '');
    btn.textContent = genre;
    btn.setAttribute('aria-pressed', activeGenre === genre ? 'true' : 'false');
    btn.onclick = () => {
      activeGenre = activeGenre === genre ? null : genre;
      renderChips();
      renderGrid();
    };
    container.appendChild(btn);
  });
}

function renderGrid() {
  const query = document.getElementById('search').value.trim().toLowerCase();
  const sortMode = document.getElementById('sort').value;

  let filtered = games.filter(g => {
    const matchesQuery = !query || g.title.toLowerCase().includes(query);
    const matchesGenre = !activeGenre || g.genres.includes(activeGenre);
    return matchesQuery && matchesGenre;
  });

  filtered.sort((a, b) => {
    if (sortMode === 'rating-desc') return b.rating - a.rating;
    if (sortMode === 'rating-asc') return a.rating - b.rating;
    if (sortMode === 'year-desc') return (b.released || '').localeCompare(a.released || '');
    return a.title.localeCompare(b.title);
  });

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  document.getElementById('count').textContent = `${filtered.length} of ${games.length} games`;

  grid.innerHTML = '';
  empty.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(g => {
    const card = document.createElement('article');
    card.className = 'card';

    const top = document.createElement('div');
    top.className = 'card-top';

    const title = document.createElement('h3');
    title.className = 'title';
    title.textContent = g.title;
    top.appendChild(title);

    if (g.rating > 0) {
      const score = document.createElement('span');
      score.className = 'score ' + scoreTier(g.rating);
      score.textContent = Math.round(g.rating);
      top.appendChild(score);
    }
    card.appendChild(top);

    const tags = document.createElement('div');
    tags.className = 'tags';
    if (g.platform) {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = g.platform;
      tags.appendChild(t);
    }
    g.genres.slice(0, 2).forEach(genre => {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = genre;
      tags.appendChild(t);
    });
    card.appendChild(tags);

    if (g.plot) {
      const plot = document.createElement('p');
      plot.className = 'plot';
      plot.textContent = g.plot;
      card.appendChild(plot);
    }

    if (g.flagged) {
      const flag = document.createElement('div');
      flag.className = 'flag';
      flag.textContent = 'Match needs confirming';
      card.appendChild(flag);
    }

    grid.appendChild(card);
  });
}

document.getElementById('subtitle').textContent = `${games.length} games, rated and tagged`;
document.getElementById('search').addEventListener('input', renderGrid);
document.getElementById('sort').addEventListener('change', renderGrid);

renderChips();
renderGrid();
</script>
