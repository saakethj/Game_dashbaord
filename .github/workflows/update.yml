name: Update game ratings

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run enrichment
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python enrich.py

      - name: Commit updated data
        run: |
          git config user.name "gamepal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add cache.sqlite dashboard.html unmatched.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update game data"
          git push
